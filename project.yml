name: MonoTask
options:
  bundleIdPrefix: com.monotask
  createIntermediateGroups: true
  xcodeVersion: "26.0"

settings:
  base:
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift.git
    from: "2.0.0"

targets:
  MonoTask:
    type: application
    platform: iOS
    supportedDestinations: [iOS, macOS]
    deploymentTarget:
      iOS: "18.0"
      macOS: "15.0"
    dependencies:
      - package: Supabase
        product: Supabase
    sources:
      - path: MonoTask
        excludes:
          - "**/*.md"
    info:
      path: MonoTask/Resources/Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSCameraUsageDescription: "Сканировать QR-код приглашения, чтобы присоединиться к общей папке MonoTask."
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - com.monotask.ios
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_NAME: MonoTask
        PRODUCT_BUNDLE_IDENTIFIER: com.monotask
        "PRODUCT_BUNDLE_IDENTIFIER[sdk=iphoneos*]": com.monotask.ios
        "PRODUCT_BUNDLE_IDENTIFIER[sdk=macosx*]": com.monotask.macos
        MARKETING_VERSION: "2.2.0"
        CURRENT_PROJECT_VERSION: 24
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIconPalette
        "ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES[sdk=iphone*]": "AppIconLight AppIconDark AppIconLightPalette AppIconDarkPalette"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS: NO
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO
        ENABLE_PREVIEWS: YES
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
