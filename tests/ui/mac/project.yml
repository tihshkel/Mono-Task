name: MonoTaskMacCaptureReview
settings:
  base:
    SWIFT_VERSION: '6.0'
    CODE_SIGN_IDENTITY: '-'
    CODE_SIGN_STYLE: Manual
targets:
  CaptureUITests:
    type: bundle.ui-testing
    platform: macOS
    deploymentTarget: '15.0'
    sources: [CaptureTests.swift]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.monotask.review.capture-ui
schemes:
  Capture:
    build:
      targets:
        CaptureUITests: all
    test:
      targets: [CaptureUITests]
